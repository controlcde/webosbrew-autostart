name: Build webOS Autostart IPK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build IPK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package IPK
        run: npm run package

      - name: Verify IPK
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(*.ipk)

          if [ "${#files[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one IPK file."
            exit 1
          fi

          echo "Created package: ${files[0]}"
          ls -lh "${files[0]}"

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v5
        with:
          name: webos-autostart-ipk
          path: '*.ipk'
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download IPK artifact
        uses: actions/download-artifact@v6
        with:
          name: webos-autostart-ipk
          path: release

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          files=(release/*.ipk)

          if [ "${#files[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one release IPK."
            exit 1
          fi

          echo "Release package: ${files[0]}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "$TAG_NAME" release/*.ipk \
            --title "webOS Homebrew Autostart $TAG_NAME" \
            --generate-notes \
            --verify-tag
