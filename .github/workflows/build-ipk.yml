name: Build webOS Autostart IPK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package IPK
        run: npm run package

      - name: Upload IPK
        uses: actions/upload-artifact@v4
        with:
          name: webosbrew-autostart-ipk
          path: '*.ipk'
          if-no-files-found: error
