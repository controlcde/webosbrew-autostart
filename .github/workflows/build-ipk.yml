name: Build webOS Autostart IPK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "package.json"
      - "package-lock.json"
      - "webpack.config.js"
      - ".github/workflows/build-ipk.yml"

permissions:
  contents: read

concurrency:
  group: webos-autostart-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package IPK
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check package version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building webOS Autostart version $VERSION"

      - name: Build application
        run: npm run build

      - name: Package IPK
        run: npm run package

      - name: Verify IPK
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          EXPECTED="org.webosbrew.autostart_${VERSION}_all.ipk"

          echo "Expected package: $EXPECTED"

          if [ ! -f "$EXPECTED" ]; then
            echo "::error::Expected IPK not found: $EXPECTED"
            echo "Available IPK files:"
            find . -maxdepth 2 -name "*.ipk" -print
            exit 1
          fi

          if [ ! -s "$EXPECTED" ]; then
            echo "::error::IPK file is empty"
            exit 1
          fi

          echo "Package verified:"
          ls -lh "$EXPECTED"
          sha256sum "$EXPECTED"

      - name: Upload IPK
        uses: actions/upload-artifact@v5
        with:
          name: webosbrew-autostart-${{ steps.version.outputs.version }}
          path: org.webosbrew.autostart_${{ steps.version.outputs.version }}_all.ipk
          if-no-files-found: error
          retention-days: 30
